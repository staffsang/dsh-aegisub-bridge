name: release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *) TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)" ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -z "$TAG" ]; then
            echo "No tag found; nothing to release."
          fi

      - name: Pack npm tarball
        if: steps.tag.outputs.tag != ''
        run: npm pack --pack-destination .

      - name: Create release if missing
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; not touching it."
            exit 0
          fi
          gh release create "$TAG" ./*.tgz \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
